name: Frontend CI

# 1. Trigger automatically on every push and pull request to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Ensure previous runs for the same branch/PR are cancelled when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Frontend
    # 2. Use latest stable Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js LTS with npm caching for faster builds
      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # Step 3: Install dependencies cleanly using package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Run ESLint to check code quality
      # NOTE: Requires "lint" script in package.json (see explanation)
      - name: Run ESLint
        run: npm run lint

      # Step 5: Run automated Vitest test suite
      - name: Run automated tests
        run: npm test

      # Step 6: Generate production build (TypeScript check + Vite bundle)
      - name: Generate production build
        run: npm run build
