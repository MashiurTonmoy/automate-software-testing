name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Frontend
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js LTS
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Generate production build
        run: npm run build

# Stage	Topic	Priority
# 1	Unit testing with Vitest	High
# 2	Integration testing	High
# 3	E2E testing with Playwright	High
# 4	GitHub branch protection rules	High
# 5	Pull Request status checks	High
# 6	CI environment variables and secrets	Medium
# 7	Test coverage and reporting	Medium
# 8	CI caching and optimization	Medium

# Package	Purpose
# Vitest	Test runner
# React Testing Library	Test React components
# jest-dom	Extra DOM assertions
# user-event	Simulate user interactions
# jsdom	Simulate a browser DOM environment